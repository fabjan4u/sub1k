[package]
name = "sub1k"
version = "0.1.0"
edition = "2021"
description = "A terminal player designed to rescue indie tracks from Spotify's <1000 stream demonetization threshold."
license = "MIT"
repository = "https://github.com/fabjan4u/sub1k"
homepage = "https://github.com/fabjan4u/sub1k"
readme = "README.md"
keywords = ["spotify", "tui", "music", "indie", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
rspotify = { version = "0.16", features = ["cli", "env-file"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
rand = "0.8"
chrono = "0.4"
futures = "0.3"
dirs = "5.0"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "sub1k"
path = "src/main.rs"

[[bin]]
name = "sub1k-sync"
path = "src/bin/sub1k-sync.rs"
