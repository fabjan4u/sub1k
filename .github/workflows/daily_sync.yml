name: Daily Spotify Underdog Playlist Refresh

on:
  schedule:
    # Elke ochtend om 04:00 UTC (06:00 NL tijd)
    - cron: '0 4 * * *'
  workflow_dispatch: # Knop in GitHub UI om handmatig direct te testen

jobs:
  sync:
    name: Sync Underdog Playlists (<1K Streams)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Sub-1K Playlist Auto-Curator
        env:
          RSPOTIFY_CLIENT_ID: ${{ secrets.RSPOTIFY_CLIENT_ID }}
          RSPOTIFY_CLIENT_SECRET: ${{ secrets.RSPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: cargo run --release --bin sub1k-sync -- sync --config playlists.toml
